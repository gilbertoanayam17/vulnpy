name: vulnpy
 
on:
  push:                                       
    branches:
      - master
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "This is a build step"
 
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "This is a test step"
      - uses: actions/upload-artifact@v4
        with:
          name: Safety
          path: archivo
        if: always()
    needs: build
 
  sca:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Safety ignores unpinned requirements (and "Werkzeug==2.2.*"), so resolve
      # the real dependency tree first and scan the exact installed versions.
      - name: Resolve dependencies
        run: |
          python -m venv .sca-venv
          .sca-venv/bin/pip install -r tests/requirements.txt
          .sca-venv/bin/pip freeze > requirements-frozen.txt

      - run: docker run --rm -v $(pwd):/src hysnsec/safety check -r ./requirements-frozen.txt --json | tee sca-results.json
        continue-on-error: true
 
      - uses: actions/upload-artifact@v4
        with:
          name: Safety
          path: sca-results.json
        if: always()

      - name: Upload SCA results to DefectDojo
        if: always()
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DEFECTDOJO_AUTH_HEADER: ${{ secrets.DEFECTDOJO_AUTH_HEADER }}
        run: bash scripts/upload_defectdojo.sh sca-results.json "Safety Scan"
