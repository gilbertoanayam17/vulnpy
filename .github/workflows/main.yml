name: vulnpy
 
on:
  push:                                       
    branches:
      - master
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "This is a build step"
 
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "This is a test step"
      - uses: actions/upload-artifact@v4
        with:
          name: Safety
          path: archivo
        if: always()
    needs: build
 
  sca:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v2
      - run: docker run --rm -v $(pwd):/src hysnsec/safety check -r ./tests/requirements.txt --json | tee sca-results.json
        continue-on-error: true
 
      - uses: actions/upload-artifact@v4
        with:
          name: Safety
          path: sca-results.json
        if: always()
